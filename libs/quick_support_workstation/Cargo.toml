[package]
name = "quick_support_workstation"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
publish = false

# Windows-only host primitive with its own lockfile and test job. Keep Cargo from
# enrolling it in the desktop application's ancestor workspace.
[workspace]

[dependencies]
quick_support_guard = { path = "../quick_support_desktop_guard" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.1", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
