[package]
name = "quick_support_guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
publish = false

# This primitive has its own lockfile and minimum-toolchain qualification. Keep Cargo
# from enrolling it in the desktop application's ancestor workspace.
[workspace]

[dependencies]
base64 = "0.22.1"
# Keep the verifier compatible with the desktop minimum; CI tests the locked
# graph on 1.75 as well as the newer diagnostic/audit toolchain.
ed25519-dalek = "=2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "=1.18.1"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.61.1", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
tokio = { version = "=1.51.6", features = ["rt", "net", "io-util", "time"] }

sha2 = "=0.10.9"
