name: Full Flutter CI

# Every-platform Flutter build (Android, iOS, macOS, Linux, Windows, web).
# Manual only: per-PR coverage comes from CI and Quick Support validation.
on:
  workflow_dispatch:

jobs:
  run-ci:
    # generate-sbom in flutter-build.yml declares contents: write; the repo
    # default token is read-only, so the caller must grant it.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
