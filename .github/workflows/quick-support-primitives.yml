name: Quick Support primitive validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-support-primitives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Receiver grant and consent primitive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libs/base/quick_support_guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.75.0 --profile minimal
      - name: Verify desktop minimum Rust compatibility
        run: cargo +1.75.0 test --locked
      - name: Verify canonical desktop guard linkage
        run: python3 ../../../tools/check-quick-support-linkage.py
      - name: Verify strict formatting, tests and diagnostics
        run: |
          cargo +1.90.0 fmt --all --check
          cargo +1.90.0 test --locked
          cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Audit this primitive's complete locked dependencies
        run: |
          cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.90.0 audit --deny warnings --file Cargo.lock
  workstation-store:
    name: Windows protected workstation identity store
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Execute protected workstation identity store fixture
        shell: pwsh
        run: |
          $output = cargo +1.90.0 test --locked --lib --features quick-support-child workstation_store -- --test-threads=1 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) { throw 'Protected workstation identity store fixture failed.' }
          if (-not ($output -match 'test result: ok\. [1-9][0-9]* passed;')) {
            throw 'No protected workstation identity store fixture executed.'
          }
  artifact:
    name: Artifact verification / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: tools/quick-support-launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Stage the signed Windows verification fixture without executing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'rustdesk-1.5.0-x86_64.exe'
          Invoke-WebRequest -Uri 'https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.exe' -OutFile $artifact
          if ((Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash -ne '8555777215510d83d2d61c9dc984e4fcc838bd7e79f9d18a42585431f5e8bb47') { throw 'Signed fixture digest mismatch' }
          "BIFROST_QS_TEST_SIGNED_ARTIFACT=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build synthetic Rust receiver for native interoperability
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          $messages = & cargo +1.90.0 test --locked --manifest-path ../../libs/base/quick_support_guard/Cargo.toml --test control --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Rust fixture compilation failed.' }
          $artifact = $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'control' -and $_.executable } | Select-Object -Last 1
          if (-not $artifact -or -not (Test-Path -LiteralPath $artifact.executable -PathType Leaf)) { throw 'Exact Rust fixture executable missing.' }
          "BIFROST_QS_TEST_RECEIVER_EXE=$($artifact.executable)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'BIFROST_QS_REQUIRE_NATIVE_INTEROP=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test downloads, public trust and publisher binding
        run: go test -race ./...
      - name: Check Go diagnostics
        run: go vet ./...
      - name: Run Windows receiver and retained-parent pipe fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --locked --manifest-path ../../libs/base/quick_support_guard/Cargo.toml
      - name: Parse private signing verifier without signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/Verify-PrivateSigning.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw 'Private signing verifier has PowerShell syntax errors.' }
