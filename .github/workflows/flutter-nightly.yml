name: Flutter Nightly Build

on:
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    # generate-sbom in flutter-build.yml declares contents: write; the repo
    # default token is read-only, so the caller must grant it.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
